appId: com.focusdesk.ai
productName: FocusDesk AI
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - electron/**/*
  - database/**/*
  - package.json
asar: true
asarUnpack:
  - "**/*.node"
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-Setup-${version}.${ext}
nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  deleteAppDataOnUninstall: false
npmRebuild: false
